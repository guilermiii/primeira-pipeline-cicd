name: CI-CD
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6.1.0
    - name: Docker Login
      uses: docker/login-action@v4.6.0
      with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: "./src"
        file: ./src/Dockerfile
        push: true
        tags: devguina/primeiro-ci-cd-aula:v1
